<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrasi Guru – SMA Negeri 1 Karangmojo</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff0f5;--card:#fff;--ink:#3b1a33;--mute:#85607a;--rose:#ff4f78;--soft:#ffd6e2;--line:#f6c9d8;--ok:#1f9d63;--bad:#d9304f;--sun:#ffc94d;--leaf:#2fb67a}
:root[data-theme=dark]{--bg:#1f0d18;--card:#33182a;--ink:#ffe9f0;--mute:#d9a9c0;--soft:#4f2340;--line:#693553}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.5}
h1,h2,h3,.fr{font-family:Fredoka,Nunito,sans-serif;margin:0}
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petals i{position:absolute;top:-30px;width:13px;height:17px;border-radius:60% 0 60% 0;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg) translateX(50px)}}
@keyframes sway{50%{transform:rotate(6deg)}}
.rose{animation:sway 3.5s ease-in-out infinite;transform-origin:50% 100%}
#login{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:26px;width:min(400px,100%);text-align:center}
.logo{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--rose);background:#fff}
.box h1{color:var(--rose);font-size:24px;margin:8px 0 0}.box p{color:var(--mute);margin:2px 0 14px}
label{display:block;text-align:left;font-weight:800;font-size:14px;margin-top:10px}
input,select,textarea{width:100%;font:600 15px Nunito;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #5ab8ff;outline-offset:2px}
.b{font:700 15px Fredoka;border:0;border-radius:14px;padding:9px 16px;cursor:pointer;color:#fff;background:var(--rose);margin:4px 4px 4px 0}
.b.g{background:var(--leaf)}.b.y{background:var(--sun);color:#3b1a33}.b.m{background:var(--mute)}.b.r{background:var(--bad)}.b.s{padding:5px 10px;font-size:13px}
.link{color:var(--rose);cursor:pointer;font-weight:800;margin-top:12px;display:inline-block;background:none;border:0;font-family:Nunito;font-size:15px}
#app{display:none;position:relative;z-index:1}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:var(--card);border-right:2px solid var(--line);padding:16px 12px;transition:transform .25s;z-index:5;overflow:auto}
aside .hd{text-align:center;margin-bottom:12px}aside .hd b{display:block;font:700 15px Fredoka;color:var(--rose)}
aside button.n{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:700 16px Fredoka;padding:10px 12px;border-radius:14px;cursor:pointer;margin:2px 0}
aside button.n.on{background:var(--rose);color:#fff}
.main{margin-left:230px;padding:16px 20px 60px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.top h2{font-size:26px;color:var(--rose)}.top .sp{flex:1}
#burger{display:none}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{border-radius:20px;padding:14px;color:#3b1a33;font-weight:800}.stat big{display:block;font:700 32px Fredoka}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:10px}.tools>div{min-width:140px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:480px}
th{background:var(--soft);text-align:left}th,td{padding:8px 10px;border-bottom:1px dashed var(--line);font-size:14px}
.bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-weight:700;font-size:14px}
.bar .l{width:90px}.bar .t{flex:1;display:flex;height:20px;border-radius:99px;overflow:hidden;background:var(--soft)}
.leg span{margin-right:12px;font-size:13px;font-weight:700}
dialog{border:3px solid var(--rose);border-radius:24px;background:var(--card);color:var(--ink);width:min(520px,94vw);max-height:90vh}
dialog::backdrop{background:#0006}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:700;z-index:20;display:none}
@media(max-width:800px){aside{transform:translateX(-100%)}aside.open{transform:none}.main{margin-left:0}#burger{display:inline-block}}
@media(prefers-reduced-motion:reduce){.rose,.petals i{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="rs" viewBox="0 0 100 130">
<path d="M50 70C48 95 52 110 50 130" stroke="#2fb67a" stroke-width="6" fill="none" stroke-linecap="round"/>
<path d="M50 105C30 95 18 100 14 88 32 84 46 92 50 105Z" fill="#3fd08f"/><path d="M50 112C68 104 82 108 88 96 68 92 54 100 50 112Z" fill="#2fb67a"/>
<circle cx="50" cy="42" r="38" fill="#e8305f"/><circle cx="30" cy="40" r="19" fill="#ff4f78"/><circle cx="70" cy="40" r="19" fill="#ff4f78"/><circle cx="50" cy="26" r="20" fill="#ff7a9a"/><circle cx="50" cy="58" r="20" fill="#ff6388"/>
<circle cx="38" cy="52" r="4" fill="#ffb3c6"/><circle cx="62" cy="52" r="4" fill="#ffb3c6"/><circle cx="40" cy="45" r="3.5" fill="#3b1a33"/><circle cx="60" cy="45" r="3.5" fill="#3b1a33"/>
<path d="M44 54Q50 60 56 54" stroke="#3b1a33" stroke-width="2.5" fill="none" stroke-linecap="round"/></symbol></defs></svg>
<div class="petals" id="petals" aria-hidden="true"></div>
<div class="toast" id="toast" role="status"></div>

<div id="login"><div class="box">
  <img class="logo" id="lg" referrerpolicy="no-referrer" alt="Logo sekolah" src="https://pbs.twimg.com/profile_images/1065877726383337473/dHK0Lz5s.jpg">
  <h1>SMA Negeri 1 Karangmojo</h1><p>Administrasi Guru</p>
  <svg class="rose" width="60" height="78" viewBox="0 0 100 130" aria-hidden="true"><use href="#rs"/></svg>
  <form id="lf" autocomplete="off">
    <div id="regn" hidden><label>Nama lengkap<input id="rn"></label></div>
    <label>NIP / Email<input id="lu" required></label>
    <label>Kata sandi<input id="lp" type="password" required minlength="4"></label>
    <button class="b" style="width:100%;margin-top:14px" id="lb">Masuk</button>
  </form>
  <button class="link" id="sw">Belum punya akun? Daftar</button>
</div></div>

<div id="app">
<aside id="side"><div class="hd"><img class="logo" id="lg2" referrerpolicy="no-referrer" alt="" style="width:56px;height:56px" src="https://pbs.twimg.com/profile_images/1065877726383337473/dHK0Lz5s.jpg"><b>SMAN 1 Karangmojo</b><small id="gn" style="color:var(--mute)"></small></div><div id="nav"></div>
<button class="b m" style="width:100%" id="th">🌙 Ganti tema</button><button class="b r" style="width:100%" id="out">Keluar</button></aside>
<div class="main"><div class="top"><button class="b" id="burger" aria-label="Menu">☰</button><h2 id="ttl"></h2><span class="sp"></span><span id="who" class="fr"></span>
<svg class="rose" width="34" height="44" viewBox="0 0 100 130" aria-hidden="true"><use href="#rs"/></svg></div><div id="view"></div></div>
</div>
<dialog id="dlg"><div id="dbody"></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var SHEET_URL=''; /* isi dengan URL Web App Google Apps Script agar data tersinkron ke Google Sheets */
var K='sman1km_v1',HARI=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],KET=['HADIR','IZIN','SAKIT','ALPA'],JN=['Tugas','Harian','Sumatif','Sumatif Tengah Semester','Sumatif Akhir Semester'];
var db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}db=db||{users:[],kelas:[],siswa:[],jadwal:[],absen:[],nilai:[],jurnal:[]};
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(function(){t.style.display='none'},2600)}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){toast('Penyimpanan penuh')}if(SHEET_URL)fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(db)}).catch(function(){})}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var P=$('#petals');for(var i=0;i<12;i++){var p=document.createElement('i');p.style.left=i*8.5+'%';p.style.background=['#ff4f78','#ffc94d','#ff9bb5','#c58bf0'][i%4];p.style.animationDuration=9+i%5*3+'s';p.style.animationDelay=-i*1.7+'s';P.appendChild(p)}
['lg','lg2'].forEach(function(id){$('#'+id).onerror=function(){this.onerror=null;this.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#ffd6e2"/><text x="50" y="66" font-size="52" text-anchor="middle">🌹</text></svg>')}});

/* tema */
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('sman_th',t)}catch(e){}$('#th').textContent=t=='dark'?'☀️ Tema terang':'🌙 Tema gelap'}
theme((function(){try{return localStorage.getItem('sman_th')}catch(e){}})()||'light');
$('#th').onclick=function(){theme(document.documentElement.dataset.theme=='dark'?'light':'dark')};

/* auth */
var reg=false,me=null;
function hash(s){var e=new TextEncoder().encode(s);return(crypto.subtle?crypto.subtle.digest('SHA-256',e).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}):Promise.resolve(btoa(s)))}
$('#sw').onclick=function(){reg=!reg;$('#regn').hidden=!reg;$('#lb').textContent=reg?'Daftar':'Masuk';this.textContent=reg?'Sudah punya akun? Masuk':'Belum punya akun? Daftar'};
$('#lf').onsubmit=function(e){e.preventDefault();var u=$('#lu').value.trim();hash($('#lp').value).then(function(h){
if(reg){if(db.users.some(function(x){return x.u==u}))return toast('Akun sudah terdaftar');db.users.push({u:u,n:$('#rn').value.trim()||u,h:h});save();toast('Pendaftaran berhasil, silakan masuk');$('#sw').click()}
else{var x=db.users.filter(function(x){return x.u==u&&x.h==h})[0];if(!x)return toast('NIP/email atau kata sandi salah');me=x;try{sessionStorage.setItem('sman_me',u)}catch(e){}start()}})};
$('#out').onclick=function(){me=null;try{sessionStorage.removeItem('sman_me')}catch(e){}$('#app').style.display='none';$('#login').style.display='grid'};
function start(){$('#login').style.display='none';$('#app').style.display='block';$('#who').textContent='Halo, '+me.n+' 🌸';$('#gn').textContent=me.n;go('dash')}

/* skema: [judul, ikon, field[k,label,tipe,opsi,dep], filter] */
var M={
kelas:['Kelas','🏫',[['nama','Nama Kelas','text'],['wali','Wali Kelas','text'],['tahun','Tahun Ajaran','text']],['kelas']],
siswa:['Siswa','🧒',[['nis','NIS','text'],['nama','Nama Siswa','text'],['kelas','Kelas','sel','kelas'],['jk','Jenis Kelamin','opt',['L','P']]],['kelas','cari']],
jadwal:['Jadwal','🗓️',[['kelas','Kelas','sel','kelas'],['hari','Hari','opt',HARI],['jam','Jam (mis. 07.00-08.30)','text'],['mapel','Mata Pelajaran','text']],['kelas','hari']],
absen:['Absen','✅',[['tanggal','Tanggal','date'],['kelas','Kelas','sel','kelas'],['siswa','Siswa','sel','siswa','kelas'],['ket','Keterangan','opt',KET]],['kelas','bulan']],
nilai:['Nilai','📝',[['kelas','Kelas','sel','kelas'],['siswa','Siswa','sel','siswa','kelas'],['jenis','Jenis Nilai','opt',JN],['nilai','Nilai (0-100)','number']],['kelas']],
jurnal:['Jurnal Mengajar','📖',[['tanggal','Tanggal','date'],['kelas','Kelas','sel','kelas'],['mapel','Mata Pelajaran','text'],['materi','Materi','text'],['catatan','Catatan','text']],['kelas']]};
function opts(f,v){if(f[3]=='kelas')return db.kelas.map(function(x){return x.nama});if(f[3]=='siswa')return db.siswa.filter(function(s){return!v.kelas||s.kelas==v.kelas}).map(function(s){return s.nama});return f[3]}
function sel(o,cur,ph){return(ph?'<option value="">'+ph+'</option>':'')+o.map(function(x){return'<option'+(x==cur?' selected':'')+'>'+esc(x)+'</option>'}).join('')}

/* navigasi */
var cur='dash',F={};
$('#nav').innerHTML='<button class="n" data-m="dash">🏠 Dashboard</button>'+Object.keys(M).map(function(k){return'<button class="n" data-m="'+k+'">'+M[k][1]+' '+M[k][0]+'</button>'}).join('')+'<button class="n" data-m="profil">👩‍🏫 Profil Guru</button>';
document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){F={};go(b.dataset.m);$('#side').classList.remove('open')}});
$('#burger').onclick=function(){$('#side').classList.toggle('open')};
function go(m){cur=m;document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.m==m)});$('#ttl').textContent=m=='dash'?'Dashboard':m=='profil'?'👩‍🏫 Profil Guru':M[m][1]+' '+M[m][0];m=='dash'?dash():m=='profil'?profil():list()}

/* dashboard */
function dash(){var cols=['#ffb3c6','#ffe08a','#a8e6cf','#b9d7ff','#e3c6ff'],h='<div class="stats">'+['kelas','siswa','absen','nilai','jurnal'].map(function(k,i){return'<div class="stat" style="background:'+cols[i]+'"><big>'+db[k].length+'</big>'+M[k][0]+'</div>'}).join('')+'<div class="stat" style="background:#ffd1a8"><big>'+db.jadwal.length+'</big>Jadwal</div></div>';
var C={HADIR:'#2fb67a',IZIN:'#5ab8ff',SAKIT:'#ffc94d',ALPA:'#ff4f78'};
h+='<div class="card"><h3>Grafik kehadiran siswa per kelas</h3><div class="leg">'+KET.map(function(k){return'<span><i style="display:inline-block;width:12px;height:12px;border-radius:50%;background:'+C[k]+'"></i> '+k+'</span>'}).join('')+'</div>';
if(!db.kelas.length)h+='<p>Belum ada data kelas. Tambahkan di menu Kelas.</p>';
db.kelas.forEach(function(k){var r=db.absen.filter(function(a){return a.kelas==k.nama}),n=r.length||1;h+='<div class="bar"><span class="l">'+esc(k.nama)+'</span><div class="t">'+KET.map(function(t){var c=r.filter(function(a){return a.ket==t}).length;return c?'<div title="'+t+': '+c+'" style="width:'+c/n*100+'%;background:'+C[t]+'"></div>':''}).join('')+'</div><span>'+(r.length?Math.round(r.filter(function(a){return a.ket=='HADIR'}).length/n*100)+'% hadir':'-')+'</span></div>'});
h+='</div><div class="card"><h3>Jurnal terbaru</h3>'+(db.jurnal.slice(-3).reverse().map(function(j){return'<p>📖 <b>'+esc(j.tanggal)+'</b> '+esc(j.kelas)+' – '+esc(j.mapel)+': '+esc(j.materi)+'</p>'}).join('')||'<p>Belum ada jurnal.</p>')+'</div>';
$('#view').innerHTML=h}

/* daftar CRUD */
function filt(){var m=M[cur],r=db[cur].slice();if(F.kelas)r=r.filter(function(x){return(cur=='kelas'?x.nama:x.kelas)==F.kelas});if(F.hari)r=r.filter(function(x){return x.hari==F.hari});if(F.bulan)r=r.filter(function(x){return(x.tanggal||'').slice(0,7)==F.bulan});if(F.cari){var q=F.cari.toLowerCase();r=r.filter(function(x){return((x.nis||'')+' '+(x.nama||'')).toLowerCase().indexOf(q)>=0})}return r}
function list(){var m=M[cur],r=filt(),h='<div class="card"><div class="tools"><button class="b" id="add">➕ Tambah</button>'+(cur=='kelas'?'<label class="b y" style="margin:4px 4px 4px 0;cursor:pointer;font-size:15px">⬆ Unggah Siswa<input type="file" id="imp2" accept=".csv,.xlsx,.xls" hidden></label><button class="b m" id="tpl2">Template Siswa</button>':'')+'<label class="b g" style="margin:4px 4px 4px 0;cursor:pointer;font-size:15px">⬆ Unggah CSV/Excel<input type="file" id="imp" accept=".csv,.xlsx,.xls,text/csv" hidden></label><button class="b m" id="tpl">Template CSV</button><button class="b m" id="exp">Ekspor CSV</button></div><div class="tools">';
m[3].forEach(function(f){h+='<div><label>'+(f=='bulan'?'Bulan':f=='hari'?'Hari':f=='cari'?'Cari NIS / nama':cur=='siswa'?'Rombel / Kelas':'Kelas')+(f=='cari'?'<input data-f="cari" placeholder="ketik lalu Enter" value="'+esc(F.cari||'')+'">':f=='bulan'?'<input type="month" data-f="bulan" value="'+(F.bulan||'')+'">':'<select data-f="'+f+'">'+sel(f=='hari'?HARI:db.kelas.map(function(x){return x.nama}),F[f],'Semua')+'</select>')+'</label></div>'});
h+='</div></div>'+panel()+'<div class="card"><div class="tw"><table><tr>'+m[2].map(function(f){return'<th>'+f[1]+'</th>'}).join('')+'<th>Aksi</th></tr>';
r.forEach(function(x){h+='<tr>'+m[2].map(function(f){return'<td>'+esc(x[f[0]])+'</td>'}).join('')+'<td><button class="b s y" data-e="'+x.id+'">✏️</button><button class="b s r" data-d="'+x.id+'">🗑️</button></td></tr>'});
h+=(r.length?'':'<tr><td colspan="9">Belum ada data. Klik Tambah atau unggah CSV.</td></tr>')+'</table></div></div>';
if(cur=='absen'&&F.kelas){var s={};db.siswa.filter(function(x){return x.kelas==F.kelas}).forEach(function(x){s[x.nama]={}});r.forEach(function(a){s[a.siswa]=s[a.siswa]||{};s[a.siswa][a.ket]=(s[a.siswa][a.ket]||0)+1});h+='<div class="card"><h3>Rekap '+(F.bulan?'bulanan ':'')+esc(F.kelas)+(F.bulan?' ('+F.bulan+')':' (semua tanggal)')+'</h3><div class="tw"><table><tr><th>Siswa</th>'+KET.map(function(k){return'<th>'+k+'</th>'}).join('')+'<th>% Hadir</th></tr>'+Object.keys(s).map(function(n){var t=0;KET.forEach(function(k){t+=s[n][k]||0});return'<tr><td>'+esc(n)+'</td>'+KET.map(function(k){return'<td>'+(s[n][k]||0)+'</td>'}).join('')+'<td>'+(t?Math.round((s[n].HADIR||0)/t*100)+'%':'-')+'</td></tr>'}).join('')+'</table></div></div>'}
$('#view').innerHTML=h;
$('#add').onclick=function(){form()};var ps=$('#ps');if(ps)ps.onclick=savePanel;var pa=$('#pall');if(pa)pa.onclick=function(){document.querySelectorAll('#view select[data-i]').forEach(function(x){x.value='HADIR'})};
$('#imp').onchange=function(e){imp(e,cur)};var i2=$('#imp2');if(i2)i2.onchange=function(e){imp(e,'siswa')};var t2=$('#tpl2');if(t2)t2.onclick=function(){dl(M.siswa[2].map(function(f){return f[0]}).join(',')+'\n','siswa_template.csv')};$('#tpl').onclick=function(){dl(m[2].map(function(f){return f[0]}).join(',')+'\n',cur+'_template.csv')};
$('#exp').onclick=function(){dl(m[2].map(function(f){return f[0]}).join(',')+'\n'+db[cur].map(function(x){return m[2].map(function(f){return'"'+String(x[f[0]]==null?'':x[f[0]]).replace(/"/g,'""')+'"'}).join(',')}).join('\n'),cur+'.csv')};
document.querySelectorAll('[data-f]').forEach(function(e){e.onchange=function(){F[e.dataset.f]=e.value;list()}});
document.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){form(db[cur].filter(function(x){return x.id==b.dataset.e})[0])}});
document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){del(b.dataset.d)}})}
function dl(t,n){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=n;a.click()}

function form(row){var m=M[cur],v=row||{};$('#dbody').innerHTML='<h3>'+(row?'Ubah ':'Tambah ')+m[0]+'</h3><form id="ff">'+m[2].map(function(f){var c;
if(f[2]=='sel'||f[2]=='opt')c='<select id="f_'+f[0]+'" required>'+sel(opts(f,v),v[f[0]],'– pilih –')+'</select>';else c='<input id="f_'+f[0]+'" type="'+f[2]+'" required value="'+esc(v[f[0]]||'')+'"'+(f[2]=='number'?' min="0" max="100"':'')+'>';return'<label>'+f[1]+c+'</label>'}).join('')+'<button class="b g">Simpan</button><button type="button" class="b m" id="cx">Batal</button></form>';
var kl=$('#f_kelas');if(kl&&$('#f_siswa'))kl.onchange=function(){var s=$('#f_siswa');s.innerHTML=sel(opts(m[2][2],{kelas:kl.value}),'','– pilih –')};
$('#cx').onclick=function(){$('#dlg').close()};
$('#ff').onsubmit=function(e){e.preventDefault();var o={};m[2].forEach(function(f){o[f[0]]=$('#f_'+f[0]).value.trim()});
if(cur=='kelas'&&db.kelas.some(function(k){return k.nama==o.nama&&k.id!=(row&&row.id)}))return toast('Nama kelas sudah ada');
if(row){if(cur=='kelas'&&row.nama!=o.nama)['siswa','jadwal','absen','nilai','jurnal'].forEach(function(t){db[t].forEach(function(x){if(x.kelas==row.nama)x.kelas=o.nama})});Object.assign(row,o)}else{o.id=uid();db[cur].push(o)}
save();$('#dlg').close();toast('Tersimpan ✔');list()};$('#dlg').showModal()}

function del(id){var x=db[cur].filter(function(r){return r.id==id})[0];
if(cur=='kelas'&&['siswa','jadwal','jurnal'].some(function(t){return db[t].some(function(r){return r.kelas==x.nama})}))return toast('Kelas masih dipakai data siswa/jadwal/jurnal. Hapus atau pindahkan dulu.');
if(!confirm('Hapus data ini?'))return;
if(cur=='siswa'){db.absen=db.absen.filter(function(a){return!(a.siswa==x.nama&&a.kelas==x.kelas)});db.nilai=db.nilai.filter(function(a){return!(a.siswa==x.nama&&a.kelas==x.kelas)})}
db[cur]=db[cur].filter(function(r){return r.id!=id});save();toast('Terhapus');list()}

/* input per kelas untuk absen & nilai (langsung di halaman saat kelas dipilih) */
function panel(){if(!F.kelas||(cur!='absen'&&cur!='nilai'))return'';var ab=cur=='absen',t=F.tgl||new Date().toISOString().slice(0,10),j=F.jenis||JN[0],s=db.siswa.filter(function(x){return x.kelas==F.kelas});
var h='<div class="card"><h3>'+(ab?'Input absen':'Input nilai')+' – '+esc(F.kelas)+'</h3><div class="tools"><div><label>'+(ab?'Tanggal<input type="date" data-f="tgl" value="'+t+'">':'Jenis nilai<select data-f="jenis">'+sel(JN,j)+'</select>')+'</label></div></div>';
if(!s.length)return h+'<p>Belum ada siswa di kelas ini. Tambahkan di menu Siswa atau unggah file.</p></div>';
h+='<div class="tw"><table><tr><th>No</th><th>NIS</th><th>Siswa</th><th>'+(ab?'Keterangan':'Nilai (0-100)')+'</th></tr>'+s.map(function(x,i){var e=db[cur].filter(function(r){return r.kelas==x.kelas&&r.siswa==x.nama&&(ab?r.tanggal==t:r.jenis==j)})[0];return'<tr><td>'+(i+1)+'</td><td>'+esc(x.nis)+'</td><td>'+esc(x.nama)+'</td><td>'+(ab?'<select data-i="'+i+'">'+sel(KET,e?e.ket:'HADIR')+'</select>':'<input data-i="'+i+'" type="number" min="0" max="100" style="width:100px" value="'+(e?esc(e.nilai):'')+'">')+'</td></tr>'}).join('')+'</table></div>';
return h+'<button class="b g" id="ps">💾 Simpan '+(ab?'absensi':'nilai')+'</button>'+(ab?'<button class="b y" id="pall">Hadir semua</button>':'')+'</div>'}
function savePanel(){var ab=cur=='absen',t=F.tgl||new Date().toISOString().slice(0,10),j=F.jenis||JN[0],k=F.kelas,n=0;
db.siswa.filter(function(x){return x.kelas==k}).forEach(function(x,i){var el=document.querySelector('#view [data-i="'+i+'"]');if(!el||el.value==='')return;var v=ab?el.value:String(Math.min(100,Math.max(0,+el.value)));
var e=db[cur].filter(function(r){return r.kelas==k&&r.siswa==x.nama&&(ab?r.tanggal==t:r.jenis==j)})[0];
if(e){if(ab)e.ket=v;else e.nilai=v}else db[cur].push(ab?{id:uid(),tanggal:t,kelas:k,siswa:x.nama,ket:v}:{id:uid(),kelas:k,siswa:x.nama,jenis:j,nilai:v});n++});
save();toast(n+' data tersimpan ✔');list()}

/* impor CSV */
function csv(t){var rows=[],r=[],c='',q=false;for(var i=0;i<t.length;i++){var ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==','||ch==';'){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(function(x){return x.trim()}))rows.push(r);r=[]}else c+=ch}r.push(c);if(r.some(function(x){return x.trim()}))rows.push(r);return rows}
function imp(e,tb){var f=e.target.files[0];e.target.value='';if(!f)return;var rd=new FileReader(),xl=/\.xlsx?$/i.test(f.name);rd.onerror=function(){toast('File gagal dibaca')};
rd.onload=function(){var rows;
if(xl){if(!window.XLSX)return toast('Pustaka Excel belum termuat (butuh internet). Gunakan CSV.');try{var wb=XLSX.read(rd.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,dateNF:'yyyy-mm-dd',defval:''}).filter(function(r){return r.some(function(x){return String(x).trim()})})}catch(x){return toast('File Excel tidak valid')}}
else rows=csv(rd.result.replace(/^\ufeff/,''));
if(!rows.length)return toast('File kosong');
var m=M[tb],hd=rows.shift().map(function(x){return String(x).trim().toLowerCase()}),ok=0,bad=0;
var idx=m[2].map(function(f){var i=hd.indexOf(f[0]);return i<0?hd.indexOf(f[1].toLowerCase()):i});if(idx.indexOf(-1)>=0)return toast('Kolom tidak cocok. Pakai Template.');
rows.forEach(function(r){var o={id:uid()},valid=true;m[2].forEach(function(f,j){var v=String(r[idx[j]]==null?'':r[idx[j]]).trim();
if(f[2]=='date'){var d=v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);if(d)v=d[3]+'-'+('0'+d[2]).slice(-2)+'-'+('0'+d[1]).slice(-2)}
if(f[2]=='opt'){var q=f[3].filter(function(z){return z.toLowerCase()==v.toLowerCase()})[0];if(q)v=q}
if(f[2]=='number'&&!(v!==''&&+v>=0&&+v<=100))valid=false;
o[f[0]]=v;if(!v)valid=false;
if(f[2]=='sel'&&f[3]=='kelas'&&v&&!db.kelas.some(function(k){return k.nama==v})){if(tb=='siswa'||tb=='jadwal'||tb=='jurnal')db.kelas.push({id:uid(),nama:v,wali:'',tahun:''});else valid=false}
if(f[3]=='siswa'&&!db.siswa.some(function(s){return s.nama==v&&s.kelas==o.kelas}))valid=false;
if(f[2]=='opt'&&f[3].indexOf(v)<0)valid=false});
if(valid&&tb=='kelas'&&db.kelas.some(function(k){return k.nama==o.nama}))valid=false;
if(valid&&tb=='siswa'&&db.siswa.some(function(x){return x.nis==o.nis}))valid=false;
if(valid){db[tb].push(o);ok++}else bad++});save();toast(ok+' data masuk'+(bad?', '+bad+' dilewati (kosong/duplikat/tidak cocok)':''));list()};
xl?rd.readAsArrayBuffer(f):rd.readAsText(f)}

/* profil guru */
function profil(){var u=me,L=[['n','Nama lengkap'],['nip','NIP'],['mapel','Mata pelajaran yang diampu'],['jabatan','Jabatan / Wali kelas'],['hp','No. HP / WhatsApp'],['alamat','Alamat']],ini=u.n.split(' ').map(function(w){return w[0]||''}).slice(0,2).join('').toUpperCase();
$('#view').innerHTML='<div class="card" style="display:flex;gap:18px;flex-wrap:wrap;align-items:center"><div style="text-align:center"><div style="width:110px;height:110px;border-radius:50%;border:3px solid var(--rose);background:var(--soft);display:grid;place-items:center;font:700 36px Fredoka;overflow:hidden">'+(u.foto?'<img src="'+u.foto+'" alt="Foto guru" style="width:100%;height:100%;object-fit:cover">':esc(ini))+'</div><label class="b g" style="cursor:pointer;display:inline-block;margin-top:8px;font-size:13px">📷 Ganti foto<input type="file" id="pf" accept="image/*" hidden></label></div><div style="flex:1;min-width:220px"><h3>'+esc(u.n)+'</h3><p style="color:var(--mute)">'+esc(u.u)+'<br>SMA Negeri 1 Karangmojo</p><p>🏫 '+db.kelas.length+' kelas · 🧒 '+db.siswa.length+' siswa · 📖 '+db.jurnal.length+' jurnal</p></div></div>'
+'<div class="card"><h3>Data profil</h3><form id="pfm">'+L.map(function(f){return'<label>'+f[1]+'<input id="p_'+f[0]+'" value="'+esc(u[f[0]]||'')+'"'+(f[0]=='n'?' required':'')+'></label>'}).join('')+'<button class="b g" style="margin-top:12px">Simpan profil</button></form></div>'
+'<div class="card"><h3>Ganti kata sandi</h3><form id="pw"><label>Sandi lama<input id="po" type="password" required></label><label>Sandi baru<input id="pn" type="password" required minlength="4"></label><button class="b" style="margin-top:12px">Ubah sandi</button></form></div>';
$('#pfm').onsubmit=function(e){e.preventDefault();L.forEach(function(f){u[f[0]]=$('#p_'+f[0]).value.trim()});save();$('#who').textContent='Halo, '+u.n+' 🌸';$('#gn').textContent=u.n;toast('Profil tersimpan ✔');profil()};
$('#pf').onchange=function(e){var f=e.target.files[0];if(!f)return;var im=new Image(),url=URL.createObjectURL(f);im.onload=function(){var c=document.createElement('canvas'),z=Math.min(im.width,im.height);c.width=c.height=200;c.getContext('2d').drawImage(im,(im.width-z)/2,(im.height-z)/2,z,z,0,0,200,200);u.foto=c.toDataURL('image/jpeg',.8);URL.revokeObjectURL(url);save();profil()};im.onerror=function(){toast('Gambar tidak valid')};im.src=url};
$('#pw').onsubmit=function(e){e.preventDefault();hash($('#po').value).then(function(h0){if(h0!=u.h)return toast('Sandi lama salah');hash($('#pn').value).then(function(h1){u.h=h1;save();$('#pw').reset();toast('Sandi diubah ✔')})})}}

try{var s=sessionStorage.getItem('sman_me');if(s){me=db.users.filter(function(x){return x.u==s})[0];if(me)start()}}catch(e){}
})();
